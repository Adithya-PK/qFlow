    @page { size: A4 portrait; margin: 0; }

      color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      text-align: center;

    .hero-box {
      background: #f8fafc;
      border: 3px solid #e2e8f0;
      border-radius: 24px;
      padding: 30px;
      margin: 25px 0;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .join-title { font-size: 32px; font-weight: 800; color: #0f172a; margin: 0 0 16px; }
    .qr-frame {
      background: #ffffff;
      padding: 16px;
      border: 4px solid #4f46e5;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(79, 70, 229, 0.15);
    }
    .qr-frame img { width: 340px; height: 340px; display: block; }
    .scan-prompt { font-size: 24px; font-weight: 800; color: #4f46e5; margin: 18px 0 0; }
    .steps-container {
      width: 100%;
      max-width: 500px;
      background: #ffffff;
      border-radius: 16px;
      padding: 18px 24px;
      text-align: left;
      margin-top: 20px;
      border: 1px solid #e2e8f0;
    }
    .step { font-size: 17px; font-weight: 600; color: #334155; margin: 8px 0; display: flex; align-items: center; }
    .step-num {
      background: #4f46e5;
      color: #ffffff;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 800;
      margin-right: 12px;
      flex-shrink: 0;
    }
    .footer {
      margin-bottom: 10px;
      border-top: 2px dashed #cbd5e1;
      padding-top: 16px;
      width: 100%;
      max-width: 550px;
    }
    .wifi-notice { font-size: 15px; font-weight: 700; color: #b45309; background: #fef3c7; padding: 10px 16px; border-radius: 8px; display: inline-block; margin-bottom: 8px; }
    .url-text { font-family: monospace; font-size: 14px; color: #64748b; margin: 4px 0 0; }
    @media print {
      body { padding: 30px; }
      .hero-box { box-shadow: none; }
    }
  </style>

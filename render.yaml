services:
  - type: web
    name: qflow
    env: node
    plan: free
    buildCommand: npm install --include=dev --prefix server && npm install --include=dev --prefix client && npm run --prefix client build
    startCommand: node server/src/server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
